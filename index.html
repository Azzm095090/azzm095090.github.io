<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workout Plan</title>
<meta name="theme-color" content="#16222e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a training logbook. Sticky header, four views (Today, Plan, Track, Guide),
   each plan section a ruled table on wide screens that folds into stacked cards on phones. */
:root{
  --bg:#eceeea; --surface:#fbfcfa; --ink:#16222e; --muted:#5b6976; --line:#d3d9d2;
  --accent:#c2410c; --on-accent:#fff; --ok:#15803d; --on-sc:#fff;
  --c-navy:#24405f; --c-orange:#c2410c; --c-green:#15803d; --c-blue:#1d4ed8;
  --c-purple:#7e22ce; --c-sky:#0369a1; --c-teal:#0f766e; --c-amber:#b45309;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --arabic:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f151b; --surface:#171f27; --ink:#e7ecef; --muted:#93a1ad; --line:#2a3641;
    --accent:#ff8a4c; --on-accent:#1a0f08; --ok:#4ade80; --on-sc:#0f151b;
    --c-navy:#8fb0d6; --c-orange:#fb923c; --c-green:#4ade80; --c-blue:#7ba6ff;
    --c-purple:#c084fc; --c-sky:#5cc3f5; --c-teal:#3fd0c0; --c-amber:#f5b041;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f151b; --surface:#171f27; --ink:#e7ecef; --muted:#93a1ad; --line:#2a3641;
  --accent:#ff8a4c; --on-accent:#1a0f08; --ok:#4ade80; --on-sc:#0f151b;
  --c-navy:#8fb0d6; --c-orange:#fb923c; --c-green:#4ade80; --c-blue:#7ba6ff;
  --c-purple:#c084fc; --c-sky:#5cc3f5; --c-teal:#3fd0c0; --c-amber:#f5b041;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ar{font-family:var(--arabic);color:var(--muted);font-weight:400;font-size:.88em}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:2px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{font:700 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-right:auto}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.status[data-s="saving"]::before,.status[data-s="loading"]::before{background:var(--c-amber)}
.status[data-s="local"]::before,.status[data-s="offline"]::before{background:var(--muted)}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:8px 14px;font-weight:600;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:4px 10px;min-height:34px;font-size:14px}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted);min-height:40px}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--surface)}
.editbar{background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:500;display:none}
.editbar .wrap{padding-top:6px;padding-bottom:6px}
body.editing .editbar{display:block}

main{padding-top:20px;padding-bottom:120px;display:flex;flex-direction:column;gap:20px}
h2{font:700 34px/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
h3{font:700 23px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h3 .ar{font-size:17px;text-transform:none;letter-spacing:0;margin-inline-start:6px}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.kicker{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* cards and sections */
.card,.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card{padding:16px}
.sec{--sc:var(--c-navy);border-top:4px solid var(--sc)}
.sec[data-c="orange"]{--sc:var(--c-orange)}.sec[data-c="green"]{--sc:var(--c-green)}
.sec[data-c="blue"]{--sc:var(--c-blue)}.sec[data-c="purple"]{--sc:var(--c-purple)}
.sec[data-c="sky"]{--sc:var(--c-sky)}.sec[data-c="teal"]{--sc:var(--c-teal)}
.sec[data-c="amber"]{--sc:var(--c-amber)}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px}
.sh h3{color:var(--sc)}
.badge{flex:none;font-size:12px;font-weight:600;color:var(--sc);border:1px solid var(--sc);border-radius:999px;padding:2px 10px;white-space:nowrap}
.row{display:grid;grid-template-columns:1fr;gap:10px;padding:12px 16px;border-top:1px solid var(--line);align-items:start}
.row.has-tick{grid-template-columns:40px 1fr}
.row.hd{display:none}
.rb{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;min-width:0}
.c{min-width:0;overflow-wrap:anywhere}
.c0{flex:1 1 100%}
.c0 .nm{font-weight:600}
.c0 .ar{display:inline-block;margin-inline-start:6px}
.short{background:color-mix(in srgb,var(--sc) 11%,var(--surface));border-radius:6px;padding:3px 9px;font-weight:600;font-size:15px}
.short::before{content:attr(data-l) " ";font-weight:400;font-size:12px;color:var(--muted)}
.long{flex:1 1 100%;color:var(--muted);font-size:14.5px}
.empty{display:none}
.row.done .c0 .nm{text-decoration:line-through;color:var(--muted)}
.tick{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-weight:700;color:transparent;padding:0}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.timerbtn{border:0;background:transparent;padding:0;font-weight:600;text-decoration:underline dotted;text-underline-offset:3px}
.tip{margin:0;padding:10px 16px;border-top:1px solid var(--line);font-size:14px;border-inline-start:4px solid var(--sc);background:color-mix(in srgb,var(--sc) 6%,var(--surface))}
.tip b{color:var(--sc)}
.tip .ar{display:block}

/* weekly cycle strip */
.cycle{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;text-align:center;min-width:0;--sc:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center}
.day .d{font-size:12px;font-weight:600;color:var(--muted)}
.day .s{font:700 14px/1.1 var(--display);text-transform:uppercase;color:var(--sc);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.day .x{font-size:11px;color:var(--muted)}
button.day[aria-pressed="true"]{border-color:var(--ink);background:color-mix(in srgb,var(--sc) 12%,var(--surface))}
.day.today .d::after{content:" •";color:var(--accent)}
.day[data-c="navy"]{--sc:var(--c-navy)}.day[data-c="orange"]{--sc:var(--c-orange)}.day[data-c="green"]{--sc:var(--c-green)}
.day[data-c="blue"]{--sc:var(--c-blue)}.day[data-c="purple"]{--sc:var(--c-purple)}.day[data-c="sky"]{--sc:var(--c-sky)}
.day[data-c="teal"]{--sc:var(--c-teal)}.day[data-c="amber"]{--sc:var(--c-amber)}

/* today */
.hero{display:flex;flex-direction:column;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px 8px 8px;font-weight:600;min-height:44px}
.chk i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;color:transparent;font-size:14px}
.chk[aria-pressed="true"]{border-color:var(--ok)}
.chk[aria-pressed="true"] i{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.note{font-size:14px;color:var(--muted);margin:0}

/* tracker */
.wk{display:flex;flex-direction:column;gap:8px}
.wk.cur{outline:2px solid var(--ink);outline-offset:6px;border-radius:6px}
.wkh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wkh b{font:700 20px/1 var(--display);text-transform:uppercase}
.wkh span{font-size:13px;color:var(--muted)}
.tcell{padding:6px 3px}
.tog{width:100%;max-width:56px;min-height:32px;border:1.5px solid var(--line);border-radius:7px;background:transparent;font-size:12px;font-weight:600;color:var(--muted);padding:0}
.tog[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tog.w[aria-pressed="false"]{border-color:var(--sc);color:var(--sc)}
.legend{font-size:13px;color:var(--muted);margin:0}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input[type="text"],input[type="date"],input[type="number"],select,textarea{width:100%;min-height:40px;padding:7px 9px;border:1.5px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-weight:400;font-size:16px}
textarea{resize:none;overflow:hidden;line-height:1.35;display:block}
input:disabled,button:disabled{opacity:.55}
.logrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.logrow .lw{grid-column:1/-1;font:700 18px/1 var(--display);text-transform:uppercase}
.logrow .wide{grid-column:1/-1}
.loghd{display:none}

/* editing */
.sh.ed{flex-direction:column;align-items:stretch;gap:10px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ib{width:38px;height:38px;border:1.5px solid var(--line);border-radius:7px;background:transparent;padding:0;font-weight:700}
.ib.del{color:var(--accent);border-color:var(--accent)}
.row.ed .rb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start}
.row.ed .c0,.row.ed .long,.row.ed .acts{grid-column:1/-1}
.row.ed .c0{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.row.ed .short{background:none;padding:0}
.row.ed .c::before{content:attr(data-l);display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px;grid-column:1/-1}
.row.ed .acts::before{display:none}
.add{display:block;width:calc(100% - 32px);margin:12px 16px;padding:10px;border:1.5px dashed var(--sc,var(--ink));border-radius:8px;background:transparent;font-weight:600;color:var(--sc,var(--ink));min-height:44px}
.add.wide{width:100%;margin:0}
details.colsed{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
details.colsed summary{font-weight:600;font-size:14px;cursor:pointer}
.colrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;padding:8px 0;border-top:1px solid var(--line);margin-top:8px;align-items:end}
.tiped{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 16px;border-top:1px solid var(--line)}
.dayed{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick button{min-width:44px;min-height:36px;border:1.5px solid var(--line);border-radius:7px;background:transparent;font-size:13px;font-weight:600;color:var(--muted)}
.daypick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.stack{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;min-height:36px}

/* floating bits */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--ink);display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:transparent;padding:10px 4px 12px;font-weight:600;color:var(--muted);font-size:14px;min-height:54px;border-top:3px solid transparent;margin-top:-2px}
.nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
.top .tabs{display:none}
#timer{position:fixed;left:12px;right:12px;bottom:68px;z-index:30;max-width:520px;margin:0 auto;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
#timer .t{font:700 34px/1 var(--display);min-width:84px}
#timer .l{flex:1;font-size:13px;min-width:0}
#timer button{border:1.5px solid var(--surface);background:transparent;color:var(--surface);border-radius:8px;min-height:40px;padding:0 12px;font-weight:600}
#timer.go{background:var(--ok)}
#toast{position:fixed;left:12px;right:12px;bottom:68px;z-index:31;max-width:420px;margin:0 auto;background:var(--ink);color:var(--surface);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
#toast button{border:0;background:transparent;color:var(--surface);font-weight:700;text-decoration:underline;min-height:36px}
#gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
#gate h2{font-size:40px}
#gate .btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;font-size:16px}
#gate-msg{margin:0;font-size:14px;color:var(--muted)}
#gate-msg.err{color:var(--accent)}
.nav{padding-bottom:env(safe-area-inset-bottom)}
[hidden]{display:none!important}

@media (min-width:760px){
  .nav{display:none}
  .top .tabs{display:flex}
  main{padding-bottom:60px}
  #timer,#toast{bottom:20px}
  .row,.row.has-tick{grid-template-columns:var(--cols);gap:14px;align-items:center}
  .row.hd{display:grid;background:var(--sc);color:var(--on-sc);font-weight:600;font-size:14px;padding-top:8px;padding-bottom:8px;border-top:0}
  .row.hd .ar{color:inherit;opacity:.85}
  .rb{display:contents}
  .c0,.long{flex:none}
  .c0 .ar{display:block;margin:0;text-align:left}
  .short{background:none;padding:0;font-weight:500;text-align:center}
  .short::before{content:none}
  .hd .c:not(:first-child){text-align:center}
  .long{color:var(--ink)}
  .empty{display:block}
  .row.ed{align-items:start}
  .row.ed .rb{display:contents}
  .row.ed .c0{display:flex;flex-direction:column}
  .row.ed .c::before{display:none}
  .day{padding:12px 4px}
  .day .s{font-size:20px}
  .tog{max-width:72px}
  .logrow{grid-template-columns:var(--lcols);align-items:center;padding:8px 0}
  .logrow .lw,.logrow .wide{grid-column:auto}
  .logrow .field>span{display:none}
  .loghd{display:grid;font-size:13px;font-weight:600;color:var(--muted);border-top:0}
  .loghd .ar{display:block}
}
@media (prefers-reduced-motion:no-preference){
  .tick,.chk i,.tog{transition:background-color .12s,border-color .12s}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1 class="brand" id="brand">Workout Plan</h1>
    <span class="status" id="status" data-s="loading" role="status">Loading</span>
    <nav class="tabs" aria-label="Views">
      <button data-act="nav" data-v="today">Today</button>
      <button data-act="nav" data-v="plan">Plan</button>
      <button data-act="nav" data-v="track">Track</button>
      <button data-act="nav" data-v="guide">Guide</button>
    </nav>
    <button class="btn" id="editbtn" data-act="edit">Edit</button>
  </div>
  <div class="editbar"><div class="wrap">Editing. Every change saves automatically.</div></div>
</header>
<main class="wrap" id="main"></main>
<nav class="nav" aria-label="Views">
  <button data-act="nav" data-v="today">Today</button>
  <button data-act="nav" data-v="plan">Plan</button>
  <button data-act="nav" data-v="track">Track</button>
  <button data-act="nav" data-v="guide">Guide</button>
</nav>
<div id="timer" hidden>
  <div class="t" id="timer-t">0:00</div><div class="l" id="timer-l">Rest</div>
  <button data-act="tplus">+30s</button><button data-act="tstop" aria-label="Stop timer">Stop</button>
</div>
<div id="gate">
  <div class="box">
    <h2>Workout Plan</h2>
    <p id="gate-msg" role="status">Loading</p>
    <button class="btn primary" id="gate-btn" hidden>
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google
    </button>
  </div>
</div>
<div id="toast" hidden><span id="toast-m"></span><button data-act="undo">Undo</button></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";
/* ---------- constants ---------- */
const DAYS=[["Sun","الأحد","Sunday"],["Mon","الاثنين","Monday"],["Tue","الثلاثاء","Tuesday"],["Wed","الأربعاء","Wednesday"],["Thu","الخميس","Thursday"],["Fri","الجمعة","Friday"],["Sat","السبت","Saturday"]];
const COLORS=["navy","orange","green","blue","purple","sky","teal","amber"];
const ROLES={workout:"On its workout day",warmup:"Before every workout",cooldown:"After every workout",daily:"Every day",info:"Guide (reference only)"};
const AR_NUM=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const h=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- the original plan (used until a saved copy exists, and for Reset) ---------- */
function defaultPlan(){
  const S=(id,role,color,title,ar,sub,cols,rows,tips)=>({id,role,color,title,ar,sub,
    cols:cols.map((c,i)=>({id:id+"-c"+i,label:c[0],ar:c[1],w:c[2]||"short",timer:!!c[3]})),

function fixPlan(p){
  if(!p||typeof p!=="object"||!Array.isArray(p.sections))return defaultPlan();
  const d=defaultPlan();
  for(const k of ["title","sub","cycleNote","logTip"])if(typeof p[k]!=="string")p[k]=d[k];
  if(!p.cycleTip||typeof p.cycleTip!=="object")p.cycleTip={t:"",ar:""};
  p.weeks=Math.min(12,Math.max(1,parseInt(p.weeks,10)||4));
  if(!Array.isArray(p.schedule))p.schedule=[];
  for(let i=0;i<7;i++)if(typeof p.schedule[i]!=="string")p.schedule[i]=null;
  p.schedule.length=7;
  if(!Array.isArray(p.checks))p.checks=[];
  p.checks.forEach(c=>{if(!Array.isArray(c.days))c.days=[];if(!c.id)c.id=uid()});
  if(!Array.isArray(p.logCols))p.logCols=d.logCols;
  p.sections.forEach(s=>{
    if(!s.id)s.id=uid();
    if(!ROLES[s.role])s.role="workout";
    if(!COLORS.includes(s.color))s.color="navy";
    for(const k of ["title","ar","sub"])if(typeof s[k]!=="string")s[k]="";
    if(!Array.isArray(s.cols)||!s.cols.length)s.cols=[{id:uid(),label:"Item",ar:"",w:"short"}];
    if(!Array.isArray(s.rows))s.rows=[];
    if(!Array.isArray(s.tips))s.tips=[];
    s.rows.forEach(r=>{if(!r.id)r.id=uid();if(!Array.isArray(r.c))r.c=[];while(r.c.length<s.cols.length)r.c.push("");r.c.length=s.cols.length;if(typeof r.ar!=="string")r.ar=""});
  });
  return p;
}
function fixTrack(t){
  if(!t||typeof t!=="object")t={};
  if(typeof t.start!=="string")t.start="";
  if(!t.checks||typeof t.checks!=="object")t.checks={};
  if(!t.log||typeof t.log!=="object")t.log={};
  return t;
}

const canon=v=>Array.isArray(v)?"["+v.map(canon).join(",")+"]":v&&typeof v==="object"?"{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+canon(v[k])).join(",")+"}":JSON.stringify(v===undefined?null:v);

let dbMode="loading"; // loading | synced | local | offline
function setStatus(){
  const el=$("#status");
  const pending=Object.values(docs).some(d=>d.dirty||d.busy);
  let s=dbMode,t="Loading";
  if(dbMode==="synced"){s=pending?"saving":"synced";t=pending?"Saving":"Saved to all devices"}
  else if(dbMode==="local")t="Saved on this device only";
  else if(dbMode==="offline")t="Can't reach saved data. Using this device's copy";
  el.dataset.s=s;el.textContent=t;
}
function touch(name){
  const d=docs[name];
  ls.set("wp-"+name,d.get());
  d.dirty=true;clearTimeout(d.timer);d.timer=setTimeout(()=>flush(d),700);setStatus();
}
async function flush(d){
  if(!d.ref){d.dirty=false;setStatus();return}
  if(d.busy||!d.dirty)return;
  d.busy=true;d.dirty=false;
  const body=JSON.parse(JSON.stringify(d.get()));
  try{await d.ref.set(body);d.tries=0;if(dbMode==="offline")dbMode="synced"}
  catch(e){
    if(e&&e.code==="unavailable"&&d.tries<2){d.tries++;d.dirty=true;clearTimeout(d.timer);d.timer=setTimeout(()=>flush(d),2500+Math.random()*1500)}
    else{d.tries=0;dbMode="offline"}
  }
  d.busy=false;
  if(d.dirty&&!d.tries)flush(d);
  setStatus();
}
function becomeReady(mode){
  if(mode)dbMode=mode;

  setStatus();

function detach(){
  unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];clearTimeout(giveUp);

function attach(u){
  detach();userEmail=u.email||"";
  ui.ready=false;dbMode="loading";setStatus();
  giveUp=setTimeout(()=>{if(!ui.ready)becomeReady("offline")},10000);
  for(const name of Object.keys(docs)){
    const d=docs[name];
    d.ref=fbDb.doc("users/"+u.uid+"/data/"+name);
    unsubs.push(d.ref.onSnapshot({includeMetadataChanges:true},snap=>{
      if(snap.metadata.hasPendingWrites)return;
      if(snap.exists&&!d.dirty&&!d.busy){
        const data=snap.data();
        if(canon(data)!==canon(d.get())){d.put(JSON.parse(JSON.stringify(data)));ls.set("wp-"+name,d.get());if(ui.ready)render()}
      }
      if(!snap.metadata.fromCache){
        d.loaded=true;
        if(Object.values(docs).every(x=>x.loaded)){clearTimeout(giveUp);dbMode="synced";becomeReady()}
      }else if(!ui.ready&&snap.exists){becomeReady("loading")}
    },err=>{
      if(err&&err.code==="permission-denied"){
        detach();
        try{localStorage.removeItem("wp-plan");localStorage.removeItem("wp-track")}catch(e){}
        fbAuth.signOut();
        gate("This Google account can't open this plan. Sign in with your own account.",true,true);

    }));
  }
}

      try{await fbAuth.signInWithRedirect(p);return}catch(e2){gate("Sign-in didn't work: "+(e2.message||e2),true,true);return}
    }

const secById=id=>plan.sections.find(s=>s.id===id);
const shortName=s=>s?(s.title.split(/[(—–:]/)[0].trim()||s.title):"Rest";
const parseDate=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const sundayOf=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()-d.getDay());
function curWeek(){ // 0 = no start date, -1 = starts later, weeks+1 = month finished
  const st=parseDate(track.start);if(!st)return 0;
  const n=Math.round((sundayOf(new Date())-sundayOf(st))/6048e5)+1;
  return n<1?-1:n>plan.weeks?plan.weeks+1:n;
}
const dayChecks=d=>(plan.schedule[d]&&secById(plan.schedule[d])?[{id:"w",label:"Workout",name:"Workout"}]:[]).concat(plan.checks.filter(c=>c.days.includes(d)));
function parseSecs(s){const m=/(\d+(?:\.\d+)?)/.exec(s||"");if(!m)return 0;return Math.round(+m[1]*(/min/i.test(s)?60:1))}
function setPath(obj,path,val){const p=path.split(".");let o=obj;for(let i=0;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]={};o=o[p[i]]}o[p[p.length-1]]=val}
function getPath(obj,path){return path.split(".").reduce((o,k)=>o==null?o:o[k],obj)}

function autosize(t){t.style.height="auto";t.style.height=t.scrollHeight+2+"px"}
function render(){

/* ---------- rest timer ---------- */
let tEnd=0,tInt=0,tName="";
function timerShow(){
  const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000)),el=$("#timer");
  $("#timer-t").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  if(left<=0){clearInterval(tInt);tInt=0;el.classList.add("go");$("#timer-l").textContent="Rest over. Next set.";try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}setTimeout(()=>{if(!tInt)el.hidden=true},6000)}
}
function timerStart(secs,name){tEnd=Date.now()+secs*1000;tName=name;const el=$("#timer");el.hidden=false;el.classList.remove("go");$("#timer-l").textContent="Rest after "+name;clearInterval(tInt);tInt=setInterval(timerShow,250);timerShow()}

/* ---------- actions ---------- */
function move(arr,i,by){const j=i+by;if(j<0||j>=arr.length)return;const x=arr[i];arr[i]=arr[j];arr[j]=x}
const actions={
  nav(b){ui.view=b.dataset.v;ui.confirmReset=false;try{history.replaceState(null,"","#"+ui.view)}catch(e){location.hash=ui.view}render();window.scrollTo(0,0)},
  edit(){ui.edit=!ui.edit;ui.confirmReset=false;let target=null;if(ui.edit&&ui.view==="today"){ui.view="plan";target=plan.schedule[ui.day]}render();if(target){const el=document.getElementById("s-"+target);el&&el.scrollIntoView({block:"start"})}},
  day(b){ui.day=+b.dataset.d;render()},
  jump(b){const el=document.getElementById("s-"+b.dataset.id);if(el){const y=el.getBoundingClientRect().top+window.scrollY-76;window.scrollTo({top:y,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}},
  tick(b){if(!track.start)track.start=ymd(sundayOf(new Date()));const k=b.dataset.k;if(track.checks[k])delete track.checks[k];else track.checks[k]=true;touch("track");render()},
  done(b){const id=b.dataset.id;if(done.ids[id])delete done.ids[id];else done.ids[id]=1;ls.set("wp-done",done);const on=!!done.ids[id];b.setAttribute("aria-pressed",on);b.closest(".row").classList.toggle("done",on)},
  timer(b){timerStart(+b.dataset.secs,b.dataset.n)},
  tplus(){if(tEnd<Date.now())tEnd=Date.now();tEnd+=30000;$("#timer").classList.remove("go");$("#timer-l").textContent="Rest after "+tName;if(!tInt)tInt=setInterval(timerShow,250);timerShow()},
  tstop(){clearInterval(tInt);tInt=0;$("#timer").hidden=true},
  startnow(){track.start=ymd(sundayOf(new Date()));touch("track");render()},

  undo(){const j=undoStack.pop();if(!j)return;plan=fixPlan(JSON.parse(j));$("#toast").hidden=true;touch("plan");render()},
  // plan edits
  addrow(b){const s=plan.sections[+b.dataset.s];snapshotForUndo();s.rows.push({id:uid(),ar:"",c:s.cols.map(()=>"")});return "#"+fid(`sections.${b.dataset.s}.rows.${s.rows.length-1}.c.0`)},
  delrow(b){const s=plan.sections[+b.dataset.s];snapshotForUndo("Row deleted");s.rows.splice(+b.dataset.r,1)},
  uprow(b){snapshotForUndo();move(plan.sections[+b.dataset.s].rows,+b.dataset.r,-1)},
  downrow(b){snapshotForUndo();move(plan.sections[+b.dataset.s].rows,+b.dataset.r,1)},
  addcol(b){const s=plan.sections[+b.dataset.s];snapshotForUndo();ui.open.add(s.id);s.cols.push({id:uid(),label:"New column",ar:"",w:"short",timer:false});s.rows.forEach(r=>r.c.push(""))},
  delcol(b){const s=plan.sections[+b.dataset.s],ci=+b.dataset.c;snapshotForUndo("Column deleted");ui.open.add(s.id);s.cols.splice(ci,1);s.rows.forEach(r=>r.c.splice(ci,1))},
  addtip(b){snapshotForUndo();plan.sections[+b.dataset.s].tips.push({t:"",ar:""})},
  deltip(b){snapshotForUndo("Tip deleted");plan.sections[+b.dataset.s].tips.splice(+b.dataset.t,1)},
  addsec(b){snapshotForUndo();const info=b.dataset.role==="info",id=uid();
    plan.sections.push({id,role:b.dataset.role,color:"navy",title:"New section",ar:"",sub:"",rows:[],tips:[],
      cols:info?[{id:uid(),label:"Item",ar:"البند",w:"short"},{id:uid(),label:"Details",ar:"",w:"long"}]
        :[{id:uid(),label:"Exercise",ar:"التمرين",w:"short"},{id:uid(),label:"Sets×Reps",ar:"مجموعات",w:"short"},{id:uid(),label:"Rest",ar:"راحة",w:"short",timer:true},{id:uid(),label:"Coaching Cue",ar:"ملاحظة",w:"long"}]});
    return "#s-"+id},
  delsec(b){const i=+b.dataset.s,id=plan.sections[i].id;snapshotForUndo("Section deleted");plan.sections.splice(i,1);plan.schedule=plan.schedule.map(x=>x===id?null:x)},
  upsec(b){snapshotForUndo();move(plan.sections,+b.dataset.s,-1)},
  downsec(b){snapshotForUndo();move(plan.sections,+b.dataset.s,1)},
  checkday(b){const c=plan.checks[+b.dataset.c],d=+b.dataset.d;c.days=c.days.includes(d)?c.days.filter(x=>x!==d):[...c.days,d].sort()},

  reset(){ui.confirmReset=true;render()},
  resetno(){ui.confirmReset=false;render()},
  signout(){signOut()},
  resetyes(){snapshotForUndo("Starting plan restored");plan=defaultPlan();ui.confirmReset=false}
};
const NO_SAVE=new Set(["signout","nav","edit","day","jump","tick","done","timer","tplus","tstop","startnow","newmonth","undo","reset","resetno"]);
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act,fn=actions[a];if(!fn)return;
  const writes=!["signout","nav","day","jump","done","timer","tplus","tstop"].includes(a);
  if(writes&&!ui.ready)return;
  const focus=fn(b);
  if(!NO_SAVE.has(a)){touch("plan");render();if(typeof focus==="string"){const el=document.querySelector(focus);if(el){el.scrollIntoView({block:"center"});if(el.focus)el.focus({preventScroll:true})}}}
});
document.addEventListener("input",e=>{

  if(t.dataset.b){if(!ui.ready)return;let v=t.value;if(t.dataset.b.startsWith("schedule.")&&v==="")v=null;setPath(plan,t.dataset.b,v);touch("plan");if(t.tagName==="TEXTAREA")autosize(t);if(t.dataset.b==="title")$("#brand").textContent=v||"Workout Plan"}
  else if(t.dataset.t){if(!ui.ready)return;setPath(track,t.dataset.t,t.value);touch("track")}
});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.rr!==undefined&&ui.ready)render()});
document.addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("colsed")){d.open?ui.open.add(d.dataset.id):ui.open.delete(d.dataset.id)}},true);
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)&&v!==ui.view){ui.view=v;render()}});
window.addEventListener("pagehide",()=>{Object.values(docs).forEach(d=>{if(d.dirty){clearTimeout(d.timer);flush(d)}})});

render();setStatus();connect();
</script>
</body>
</html>
